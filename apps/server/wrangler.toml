name = "time-tracker"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "time-tracker"
# Placeholder. Paste the id printed by `wrangler d1 create time-tracker` (docs/07 owner setup).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[triggers]
crons = ["* * * * *"]
