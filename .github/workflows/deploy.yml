name: Deploy

# Deploys the app to Cloudflare (free tier) from GitHub, so no computer is needed.
# Runs on every push to main and on demand from the Actions tab.
# Needs three repository secrets; see docs/08-deploy.md. Without them it skips.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_TOKEN: ${{ secrets.APP_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check secrets
        id: secrets
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$APP_TOKEN" ] || missing="$missing APP_TOKEN"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add these repository secrets to deploy:$missing. See docs/08-deploy.md."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Setup pnpm
        if: steps.secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm typecheck && pnpm test

      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm build

      - name: Find or create the database
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/server
        run: |
          find_id() {
            pnpm exec wrangler d1 list --json | jq -r '.[] | select(.name == "time-tracker") | .uuid' | head -n 1
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            echo "Creating the time-tracker database"
            pnpm exec wrangler d1 create time-tracker --no-update-config
            id="$(find_id)"
          fi
          if [ -z "$id" ]; then
            echo "::error::Could not find or create the time-tracker D1 database. Check the API token has D1 Edit permission."
            exit 1
          fi
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          grep -n '^database_id' wrangler.toml

      - name: Apply database migrations
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/server
        run: pnpm exec wrangler d1 migrations apply DB --remote

      - name: Deploy the Worker
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/server
        run: |
          secrets_file="$RUNNER_TEMP/secrets.json"
          jq -n --arg token "$APP_TOKEN" '{AUTH_TOKEN: $token}' > "$secrets_file"
          pnpm exec wrangler deploy --secrets-file "$secrets_file" | tee "$RUNNER_TEMP/deploy.log"
          rm -f "$secrets_file"
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1)"
          echo "APP_URL=$url" >> "$GITHUB_ENV"

      - name: Check the app answers
        if: steps.secrets.outputs.ready == 'true' && env.APP_URL != ''
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$APP_URL/api/health"; then
              echo
              echo "::notice title=Deployed::Open $APP_URL in Safari on your iPhone, then Share > Add to Home Screen."
              {
                echo "### Deployed"
                echo
                echo "Your app: $APP_URL"
                echo
                echo "First time? Open it in Safari on your iPhone, tap Share > Add to Home Screen, then follow docs/08-deploy.md step 5."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$APP_URL/api/health did not answer"
          exit 1
